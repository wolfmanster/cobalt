name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 9.6.0
  GRADLE_VERSION: 9.7.0

jobs:
  android:
    name: Test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.1.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Capacitor web assets
        run: pnpm --dir apps/client build

      - name: Run Android tests and build Debug APK
        run: gradle -p Android/project test lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: Android/project/**/build/{reports,test-results}/**
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x-media-archive-debug-apk
          path: Android/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
