org.gradle.jvmargs=-Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36
# JDK 17 is the repository toolchain; avoid the AGP JDK-image transform that
# is incompatible with this Android SDK/JDK combination.
android.disableJdkImageTransform=true
android.experimental.disableJdkImageTransform=true
